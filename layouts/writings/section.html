{{ define "main" }}
<main class="container">
    <h1>{{ .Title }}</h1>
    {{ .Content }}

    {{ range .RegularPagesRecursive.ByDate.Reverse }}
    <article class="writing-entry">
        <h2><a href="{{ .RelPermalink }}">{{ .Title }}</a></h2>
        {{ partial "writing-meta.html" . }}
    </article>
    {{ else }}
    <p>Coming soon!</p>
    {{ end }}
</main>
{{ end }}
